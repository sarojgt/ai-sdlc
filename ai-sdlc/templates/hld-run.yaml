hld_run:
  run_id: "RUN-{{ initiative.id }}-HLD-{{ task.sequence }}"
  initiative_id: "{{ initiative.id }}"
  task_type: hld
  profile: "{{ hld.profile }}"
  agent:
    provider: "{{ agent.provider }}"
    model: "{{ agent.model }}"
  requirement:
    artifact_id: "REQ-{{ initiative.id }}"
    version: "{{ requirement.version }}"
    content_sha256: "{{ requirement.hash }}"
  context:
    pack_id: "CTX-{{ initiative.id }}-v{{ context.version }}"
    pack_version: "{{ context.version }}"
    manifest: "context-manifest.yaml"
    content_sha256: "{{ context.hash }}"
  design_baseline: "evidence/design-baseline.yaml"
  policy:
    allowed_tools: [read_context, read_repository, render_diagram]
    denied_tools: [approve_architecture, merge, deploy_production]
  status: request-prepared
  human_approval_required: true
