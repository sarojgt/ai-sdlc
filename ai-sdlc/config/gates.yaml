gates:
  requirements:
    required_role: product_owner
    artifact_type: requirement
    next_state: hld_review
    automated_checks:
      - das_schema_valid
      - acceptance_criteria_present
      - business_outcome_present
      - scope_and_boundaries_present
      - stakeholders_present
      - data_and_integration_context_present
      - context_manifest_present
      - traceability_complete
  hld:
    required_role: solution_architect
    artifact_type: hld
    next_state: lld_draft
    automated_checks:
      - das_schema_valid
      - hld_core_present
      - context_gap_register_present
      - risk_register_present
      - requirements_coverage_complete
      - no_blocking_comments
    conditional_checks:
      - multiple_options_when_material_tradeoff_exists
      - tradeoff_analysis_when_options_are_present
      - diagrams_when_a_visual_explains_the_decision
      - rollout_or_rollback_when_delivery_or_migration_is_affected
      - adrs_when_a_decision_requires_a_separate_record
    invalidates_on_change: [lld, implementation_plan, stories]
  lld:
    required_role: senior_engineer
    artifact_type: lld
    next_state: implementation_ready
    automated_checks:
      - approved_hld_parent
      - contracts_present
      - test_strategy_present
      - migration_strategy_present
  implementation:
    required_role: codeowner
    artifact_type: pull_request
    next_state: release_ready
    automated_checks:
      - approved_hld_parent
      - approved_lld_parent
      - tests_pass
      - security_checks_pass
      - traceability_complete
  release:
    required_role: release_owner
    artifact_type: release_evidence
    next_state: deployed
    automated_checks:
      - deployment_health_present
      - rollback_plan_present
      - required_checks_pass
