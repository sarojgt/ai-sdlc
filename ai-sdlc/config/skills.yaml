skills:
  - id: requirements-analysis
    entrypoint: "ai-sdlc-skill requirements-analysis"
    input: [source_work_item, consistent_context, relative_context]
    output: requirement
    human_owner: product_owner
    prohibited_actions: [approve_requirement, approve_architecture]
  - id: hld-generation
    entrypoint: "ai-sdlc-skill hld-generation"
    input: [approved_requirement, consistent_context, relative_context, guardrails]
    output: hld
    human_owner: solution_architect
    required_outputs: [change_assessment, context_gap_register, risk_register, recommendation, traceability]
    conditional_outputs:
      - multiple_options_when_material_tradeoff_exists
      - tradeoff_analysis_when_options_are_present
      - diagrams_when_a_visual_explains_the_decision
      - rollout_or_rollback_when_delivery_or_migration_is_affected
      - adrs_when_a_decision_requires_a_separate_record
    prohibited_actions: [approve_architecture, generate_implementation_before_approval]
  - id: lld-generation
    entrypoint: "ai-sdlc-skill lld-generation"
    input: [approved_hld, relative_context, guardrails]
    output: lld
    human_owner: senior_engineer
    prohibited_actions: [change_hld_intent, approve_lld]
  - id: implementation
    entrypoint: "ai-sdlc-skill implementation"
    input: [approved_lld, scoped_workstream, repository_context]
    output: pull_request
    human_owner: codeowner
    prohibited_actions: [merge, deploy_production, change_approved_design]
