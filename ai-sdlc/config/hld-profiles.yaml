hld_profiles:
  auto:
    max_iterations: 5
    max_elapsed_minutes: 45
    agent_timeout_minutes: 15
    max_diagrams: 6
    guidance: "Run the preflight impact assessment first, select small, medium, or large, then apply the matching level of detail. Do not guess missing facts."
  small:
    max_iterations: 2
    max_elapsed_minutes: 12
    agent_timeout_minutes: 5
    max_diagrams: 2
    guidance: "Always retain the mandatory core: Motivation, Solution Overview, Solution Design, Risks, and one Context gaps register. Select only relevant optional sections such as High Level Business Requirements, Architecture Principles Applied, Non-Functional Requirements, Assumptions, and Key Design Decisions. Omit Pending Items from ARB, Traceability, and unchanged platform detail when they have no useful content. Link supporting detail only when needed; do not use line count as a quality gate."
  medium:
    max_iterations: 3
    max_elapsed_minutes: 20
    agent_timeout_minutes: 7
    max_diagrams: 4
    guidance: "Include only the material alternatives, trade-offs, risks, rollout, and operational impact. Keep the primary HLD reviewable, use the reference section names, and link deeper detail instead of expanding every available subsection."
  large:
    max_iterations: 5
    max_elapsed_minutes: 30
    agent_timeout_minutes: 10
    max_diagrams: 6
    guidance: "Keep hld.md as a decision summary using the reference section names. Create linked supporting documents for security, deployment, migration, options, or other depth only when the detail would make the main review difficult."
