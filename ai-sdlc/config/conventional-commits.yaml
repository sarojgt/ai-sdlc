version: "1.0"
description: "Company Conventional Commit policy for AI-SDLC changes"
format: "type(scope)!: description"
scopes:
  - initiative
  - requirement
  - context
  - hld
  - lld
  - approval
  - traceability
  - workflow
  - policy
  - release
  - ai-sdlc
  - repo
types:
  feat:
    release: minor
    meaning: "A user-visible capability or initiative workflow feature"
  fix:
    release: patch
    meaning: "A defect correction"
  perf:
    release: patch
    meaning: "A performance improvement"
  refactor:
    release: patch
    meaning: "An internal behavior-preserving change"
  revert:
    release: patch
    meaning: "A reversal of an earlier change"
  docs:
    release: none
    meaning: "Documentation-only change"
  test:
    release: none
    meaning: "Test-only change"
  chore:
    release: none
    meaning: "Maintenance or metadata change"
  ci:
    release: none
    meaning: "CI or workflow change"
  build:
    release: none
    meaning: "Build or dependency change"
  style:
    release: none
    meaning: "Formatting-only change"
breaking_change:
  release: major
  syntax: "BREAKING CHANGE: explanation or type(scope)!: description"
release_scope_policy:
  framework_release_scopes: [workflow, policy, release, ai-sdlc, repo]
  artifact_only_scopes: [initiative, requirement, context, hld, lld, approval, traceability]
  explanation: "Artifact commits describe the initiative lifecycle but do not version the AI-SDLC framework itself."
branch_naming:
  format: "type/scope-short-description"
  examples:
    - "feat/initiative-card-blocking"
    - "feat/hld-card-blocking"
    - "fix/workflow-approval-sync"
    - "docs/policy-branch-naming"
    - "ci/release-semantic-tags"
  prohibited_prefixes: [agent, copilot, codex, claude, gemini, qwen, ai]
