agent_providers:
  codex:
    adapter_command: "ai-sdlc-agent-codex"
    default_model: "gpt-5.6-luna"
    model_selection: per_run
    models:
      - "gpt-5.6-luna"
      - "gpt-5.6-terra"
      - "gpt-5.6-sol"
      - "gpt-5.3-codex"
    capabilities: [requirements, hld, lld, implementation, review]
    execution: local_cli
    approval_authority: none
  claude:
    adapter_command: "ai-sdlc-agent-claude"
    default_model: "provider-default"
    model_selection: per_run
    models: []
    capabilities: [requirements, hld, lld, implementation, review]
    execution: local_cli
    approval_authority: none
  github-copilot:
    adapter_command: "ai-sdlc/tooling/providers/github-copilot.sh"
    default_model: "claude-haiku-4.5"
    model_selection: per_run
    models:
      - "auto"
      - "claude-haiku-4.5"
      - "claude-opus-4.5"
      - "claude-opus-4.6"
      - "claude-opus-4.8"
      - "claude-sonnet-4.5"
      - "claude-sonnet-4.6"
      - "gemini-2.5-pro"
      - "gemini-3.5-flash"
      - "gemini-3.6-flash"
      - "gpt-5-mini"
      - "gpt-5.3-codex"
      - "gpt-5.4"
      - "gpt-5.5"
      - "gpt-5.6-luna"
      - "gpt-5.6-sol"
      - "gpt-5.6-terra"
      - "mai-code-1-flash"
      - "raptor-mini"
      - "kimi-k2.7-code"
      - "grok-4.5"
    capabilities: [requirements, hld, lld, implementation, review]
    execution: github_actions_cli
    approval_authority: none
  custom:
    adapter_command: "ai-sdlc-agent-custom"
    default_model: "provider-default"
    model_selection: per_run
    models: []
    capabilities: [requirements, hld, lld, implementation, review]
    execution: managed_adapter
    approval_authority: none

contract:
  input: "hld-run.yaml"
  output: "agent-response.yaml"
  artifacts_directory: "generated/"
  required_metadata:
    - initiative_id
    - task_type
    - context_pack_id
    - context_pack_hash
    - skill_id
    - policy_version
  prohibited:
    - approve_architecture
    - approve_requirements
    - merge_protected_branch
    - deploy_production
