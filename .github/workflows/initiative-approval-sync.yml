name: Initiative Post-Merge Processing

on:
  pull_request:
    types:
      - closed
    paths:
      - "ai-sdlc/initiatives/**"
  workflow_dispatch:
    inputs:
      initiative_dir:
        description: Initiative directory, for example ai-sdlc/initiatives/DEMO-005
        required: true
        type: string
      pull_request_number:
        description: Optional merged PR number used to recover human approval metadata
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: initiative-post-merge-${{ github.event.pull_request.number || inputs.pull_request_number || inputs.initiative_dir }}
  cancel-in-progress: false

jobs:
  prepare:
    if: >
      (github.event_name == 'pull_request' &&
       github.event.pull_request.merged == true &&
       github.event.pull_request.head.repo.full_name == github.repository) ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      initiative_dir: ${{ steps.scope.outputs.initiative_dir }}
      initiative_name: ${{ steps.scope.outputs.initiative_name }}
      approved: ${{ steps.scope.outputs.approved }}
      reviewer: ${{ steps.scope.outputs.reviewer }}
      review_id: ${{ steps.scope.outputs.review_id }}
      submitted_at: ${{ steps.scope.outputs.submitted_at }}
      review_commit: ${{ steps.scope.outputs.review_commit }}
      head_commit: ${{ steps.scope.outputs.head_commit }}
      intake_change: ${{ steps.scope.outputs.intake_change }}
    steps:
      - name: Checkout default branch
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Determine initiative and approval scope
        id: scope
        uses: actions/github-script@v9
        env:
          INITIATIVE_DIR: ${{ inputs.initiative_dir }}
          PULL_REQUEST_NUMBER: ${{ inputs.pull_request_number }}
        with:
          script: |
            const isDispatch = context.eventName === 'workflow_dispatch';
            const pullNumber = isDispatch
              ? Number(process.env.PULL_REQUEST_NUMBER || 0)
              : context.payload.pull_request.number;

            let initiativeDirs = [];
            let intakeChange = false;
            if (isDispatch) {
              const initiativeDir = (process.env.INITIATIVE_DIR || '').trim();
              if (!/^ai-sdlc\/initiatives\/[^/]+$/.test(initiativeDir)) {
                core.setFailed('initiative_dir must match ai-sdlc/initiatives/<ID>');
                return;
              }
              initiativeDirs = [initiativeDir];
            } else {
              const files = await github.paginate(github.rest.pulls.listFiles, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: pullNumber,
                per_page: 100,
              });
              initiativeDirs = [...new Set(files
                .map(file => file.filename)
                .filter(name => name.startsWith('ai-sdlc/initiatives/'))
                .map(name => name.split('/').slice(0, 3).join('/'))
              )];
              const paths = files.map(file => file.filename);
              intakeChange = paths.some(name =>
                /^ai-sdlc\/initiatives\/[^/]+\/requirement\.md$/.test(name) ||
                /^ai-sdlc\/initiatives\/[^/]+\/context\/relative\//.test(name)
              ) && paths.every(name =>
                /^ai-sdlc\/initiatives\/[^/]+\/requirement\.md$/.test(name) ||
                /^ai-sdlc\/initiatives\/[^/]+\/context\/relative\//.test(name)
              );
            }

            if (initiativeDirs.length !== 1) {
              core.setFailed(`Expected exactly one initiative directory, found ${initiativeDirs.length}: ${initiativeDirs.join(', ')}`);
              return;
            }

            let approved = false;
            let reviewer = '';
            let reviewId = '';
            let submittedAt = '';
            let reviewCommit = '';
            let headCommit = '';

            if (pullNumber > 0) {
              const pullRequest = isDispatch
                ? (await github.rest.pulls.get({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    pull_number: pullNumber,
                  })).data
                : context.payload.pull_request;
              headCommit = pullRequest.head.sha;
              const reviews = await github.paginate(github.rest.pulls.listReviews, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: pullNumber,
                per_page: 100,
              });

              // Keep the latest review state per reviewer. Approval is valid only
              // when at least one reviewer remains approved and nobody has a
              // later changes_requested review.
              const latestByReviewer = new Map();
              for (const review of reviews
                .filter(item => item.user && item.submitted_at)
                .sort((a, b) => new Date(a.submitted_at) - new Date(b.submitted_at))) {
                latestByReviewer.set(review.user.login, review);
              }
              const latest = [...latestByReviewer.values()];
              const blocking = latest.find(item => item.state === 'CHANGES_REQUESTED');
              const accepted = latest
                .filter(item => item.state === 'APPROVED')
                .sort((a, b) => new Date(b.submitted_at) - new Date(a.submitted_at))[0];

              if (accepted && !blocking && accepted.commit_id === headCommit) {
                approved = true;
                reviewer = accepted.user.login;
                reviewId = String(accepted.id);
                submittedAt = accepted.submitted_at;
                reviewCommit = accepted.commit_id;
              }
            }

            core.setOutput('initiative_dir', initiativeDirs[0]);
            core.setOutput('initiative_name', initiativeDirs[0].split('/').pop());
            core.setOutput('approved', String(approved));
            core.setOutput('reviewer', reviewer);
            core.setOutput('review_id', reviewId);
            core.setOutput('submitted_at', submittedAt);
            core.setOutput('review_commit', reviewCommit);
            core.setOutput('head_commit', headCommit);
            core.setOutput('intake_change', String(isDispatch || intakeChange));

      - name: Expand reusable boilerplate
        if: steps.scope.outputs.intake_change == 'true'
        run: python3 ai-sdlc/tooling/expand_initiative.py "${{ steps.scope.outputs.initiative_dir }}"

      - name: Sync human approval metadata
        if: steps.scope.outputs.intake_change == 'true'
        env:
          REVIEWER: ${{ steps.scope.outputs.reviewer }}
          APPROVED: ${{ steps.scope.outputs.approved }}
        run: |
          if [ "$APPROVED" = "true" ]; then
            python3 ai-sdlc/tooling/validate_reviewer.py product_owner "$REVIEWER"
          fi
          python3 ai-sdlc/tooling/sync_initiative_approval.py \
            "${{ steps.scope.outputs.initiative_dir }}" \
            "${{ steps.scope.outputs.reviewer }}" \
            "${{ steps.scope.outputs.review_id }}" \
            "${{ steps.scope.outputs.submitted_at }}" \
            "${{ steps.scope.outputs.approved }}" \
            "${{ steps.scope.outputs.review_commit }}" \
            "${{ steps.scope.outputs.head_commit }}"

      - name: Validate expanded initiative
        if: steps.scope.outputs.intake_change == 'true'
        run: bash ai-sdlc/tooling/validate_structure.sh "${{ steps.scope.outputs.initiative_dir }}"

      - name: Resolve policy-compliant automation branch
        id: branch
        env:
          INITIATIVE_NAME: ${{ steps.scope.outputs.initiative_name }}
        run: |
          set -euo pipefail
          normalized="$(printf '%s' "$INITIATIVE_NAME" | tr '[:upper:]' '[:lower:]' | tr '_' '-')"
          echo "name=chore/initiative-post-merge-$normalized" >> "$GITHUB_OUTPUT"

      - name: Create post-merge automation pull request
        id: create_pr
        if: steps.scope.outputs.intake_change == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.AI_SDLC_AUTOMATION_TOKEN || github.token }}
          branch: ${{ steps.branch.outputs.name }}
          commit-message: "chore(ai-sdlc): process ${{ steps.scope.outputs.initiative_name }} after merge"
          title: "chore(ai-sdlc): process ${{ steps.scope.outputs.initiative_name }} after intake merge"
          body: |
            Auto-generated from the merged initiative intake PR.

            This PR adds initiative metadata and the context manifest. HLD,
            LLD, feedback, and evidence artifacts are created later by their
            gated lifecycle workflows. Human approval metadata is recorded only
            when the source PR has a valid human approval.

            AI does not grant approval. The approval metadata is derived only
            from GitHub human review history.
          labels: ai-sdlc, automation
          delete-branch: true

      - name: Enable scaffold PR auto-merge
        if: steps.create_pr.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ secrets.AI_SDLC_AUTOMATION_TOKEN || github.token }}
          PR_NUMBER: ${{ steps.create_pr.outputs.pull-request-number }}
        run: |
          set -euo pipefail
          gh pr merge "$PR_NUMBER" --auto --squash --repo "$GITHUB_REPOSITORY"
