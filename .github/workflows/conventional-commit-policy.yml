name: Conventional Commit Policy

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - edited
      - ready_for_review

permissions:
  contents: read
  pull-requests: read

jobs:
  conventional-commits:
    name: conventional-commits
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository policy
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Validate PR title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          python3 ai-sdlc/tooling/validate_conventional_commits.py --pr-title "$PR_TITLE"
