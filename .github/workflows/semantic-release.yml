name: Semantic Release

on:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: semantic-release-main
  cancel-in-progress: false

jobs:
  release:
    name: semantic-release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout complete history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Calculate next version
        id: version
        run: |
          tag="$(python3 ai-sdlc/tooling/semantic_version.py | tail -n 1)"
          if [ -z "$tag" ] || ! printf '%s' "$tag" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "No semantic release required."
            exit 0
          fi
          echo "release=true" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Next release: $tag"

      - name: Create GitHub release and tag
        if: steps.version.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.version.outputs.tag }}" \
            --target "${GITHUB_SHA}" \
            --title "${{ steps.version.outputs.tag }}" \
            --generate-notes
