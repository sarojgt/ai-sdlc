name: Semantic Release

on:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: semantic-release-main
  cancel-in-progress: false

jobs:
  release:
    name: semantic-release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout complete history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Calculate next version
        id: version
        run: |
          framework_tag="$(python3 ai-sdlc/tooling/semantic_version.py | tail -n 1)"
          if ! printf '%s' "$framework_tag" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            framework_tag=""
          fi
          artifact_tags="$(python3 ai-sdlc/tooling/semantic_artifact_version.py)"
          {
            echo "framework_tag=$framework_tag"
            echo "artifact_tags<<EOF"
            echo "$artifact_tags"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          if [ -n "$framework_tag" ] || [ -n "$artifact_tags" ]; then
            echo "release=true" >> "$GITHUB_OUTPUT"
          else
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "No semantic release required."
          fi

      - name: Create semantic releases and tags
        if: steps.version.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          framework_tag="${{ steps.version.outputs.framework_tag }}"
          if [ -n "$framework_tag" ]; then
            gh release create "$framework_tag" \
              --target "${GITHUB_SHA}" \
              --title "$framework_tag" \
              --generate-notes
          fi
          while IFS='|' read -r track tag bump; do
            [ -n "$tag" ] || continue
            gh release create "$tag" \
              --target "${GITHUB_SHA}" \
              --title "$tag" \
              --generate-notes
          done <<'EOF'
          ${{ steps.version.outputs.artifact_tags }}
          EOF
