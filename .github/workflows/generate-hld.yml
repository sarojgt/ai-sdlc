name: Generate HLD with Copilot

on:
  pull_request:
    types: [closed]
    branches: [main]
    paths:
      - "ai-sdlc/initiatives/**"
  workflow_dispatch:
    inputs:
      initiative_id:
        description: Initiative ID, for example <WORK-ITEM-ID>
        required: true
        type: string
      generator_model:
        description: "Generator model ID or auto. See ai-sdlc/config/copilot-model-catalog.md."
        required: false
        type: string
        default: gpt-5.6-luna
      reviewer_model:
        description: "Reviewer model ID; must differ from generator. See ai-sdlc/config/copilot-model-catalog.md."
        required: false
        type: string
        default: gemini-3.5-flash
      agent_timeout_minutes:
        description: Timeout for each generator or reviewer call
        required: false
        type: choice
        options: [10, 15, 20, 30]
        default: 15
      assessment_timeout_minutes:
        description: Timeout for the automatic HLD impact assessment
        required: false
        type: choice
        options: [5, 10, 15]
        default: 5
      force:
        description: Rerun even if HLD loop evidence already exists
        required: false
        default: false
        type: boolean
      resume:
        description: Resume from the latest HLD checkpoint
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  pull-requests: write
  copilot-requests: write

concurrency:
  group: hld-generation-${{ inputs.initiative_id || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  resolve:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.merged == true &&
       startsWith(github.event.pull_request.head.ref, 'chore/initiative-post-merge-'))
    runs-on: ubuntu-latest
    outputs:
      initiative_id: ${{ steps.scope.outputs.initiative_id }}
      should_run: ${{ steps.scope.outputs.should_run }}
    steps:
      - name: Checkout default branch
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Resolve approved initiative
        id: scope
        env:
          DISPATCH_INITIATIVE: ${{ inputs.initiative_id }}
          FORCE_RUN: ${{ inputs.force || false }}
          PULL_REQUEST_NUMBER: ${{ github.event.pull_request.number || 0 }}
          EVENT_NAME: ${{ github.event_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          initiative_id="$DISPATCH_INITIATIVE"
          if [ "$EVENT_NAME" = "pull_request" ]; then
            mapfile -t initiatives < <(
              gh pr view "$PULL_REQUEST_NUMBER" --json files --jq '.files[].path' |
                awk -F/ '/^ai-sdlc\/initiatives\/[^/]+\// {print $3}' | sort -u
            )
            if [ "${#initiatives[@]}" -ne 1 ]; then
              echo "Expected exactly one initiative in the merged scaffold PR; found ${#initiatives[@]}" >&2
              exit 1
            fi
            initiative_id="${initiatives[0]}"
          fi
          target="ai-sdlc/initiatives/$initiative_id"
          test -d "$target" || { echo "Unknown initiative: $initiative_id" >&2; exit 1; }
          if ! python3 ai-sdlc/tooling/approval_gate.py requirements "$target"; then
            echo "Requirements gate has not passed; HLD generation will not start."
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            echo "initiative_id=$initiative_id" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$FORCE_RUN" != "true" ] && [ -f "$target/evidence/hld-loop.yaml" ]; then
            echo "HLD loop evidence already exists; skipping duplicate automatic run."
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            echo "initiative_id=$initiative_id" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "initiative_id=$initiative_id" >> "$GITHUB_OUTPUT"
          echo "should_run=true" >> "$GITHUB_OUTPUT"

  hld:
    needs: resolve
    if: needs.resolve.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout default branch
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install GitHub Copilot CLI
        run: npm install -g @github/copilot

      - name: Validate independent model selection
        env:
          GENERATOR_MODEL: ${{ inputs.generator_model || 'gpt-5.6-luna' }}
          REVIEWER_MODEL: ${{ inputs.reviewer_model || 'gemini-3.5-flash' }}
        run: |
          set -euo pipefail
          test -n "$GENERATOR_MODEL" && test -n "$REVIEWER_MODEL"
          if [ "$GENERATOR_MODEL" = "$REVIEWER_MODEL" ]; then
            echo "Generator and reviewer must use different models." >&2
            exit 1
          fi
          echo "Generator model: $GENERATOR_MODEL"
          echo "Reviewer model: $REVIEWER_MODEL"

      - name: Prepare HLD branch without rewriting history
        id: prepare
        env:
          INITIATIVE_ID: ${{ needs.resolve.outputs.initiative_id }}
        run: |
          set -euo pipefail
          normalized="$(printf '%s' "$INITIATIVE_ID" | tr '[:upper:]' '[:lower:]' | tr '_' '-')"
          branch="feat/hld-$normalized"
          if git ls-remote --exit-code origin "refs/heads/$branch" >/dev/null 2>&1; then
            git fetch origin "$branch"
            git switch -c "$branch" "origin/$branch"
            echo "Resuming existing HLD branch: $branch"
          else
            git switch -c "$branch"
            echo "Creating HLD branch: $branch"
          fi
          echo "name=$branch" >> "$GITHUB_OUTPUT"

      - name: Install Mermaid renderer
        run: npm install --global @mermaid-js/mermaid-cli

      - name: Run bounded HLD generation and review loop
        env:
          GENERATOR_MODEL: ${{ inputs.generator_model || 'gpt-5.6-luna' }}
          REVIEWER_MODEL: ${{ inputs.reviewer_model || 'gemini-3.5-flash' }}
          # The impact-assessment agent selects small, medium, or large.
          # A manual profile override would undermine proportional HLDs.
          HLD_PROFILE: auto
          AGENT_TIMEOUT_MINUTES: ${{ inputs.agent_timeout_minutes || '15' }}
          ASSESSMENT_TIMEOUT_MINUTES: ${{ inputs.assessment_timeout_minutes || '5' }}
          RESUME: ${{ inputs.resume || false }}
          GITHUB_TOKEN: ${{ github.token }}
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN || github.token }}
        run: |
          set -euo pipefail
          export AI_SDLC_HLD_PROFILE="$HLD_PROFILE"
          export AI_SDLC_AGENT_TIMEOUT_SECONDS="$((AGENT_TIMEOUT_MINUTES * 60))"
          export AI_SDLC_ASSESSMENT_TIMEOUT_SECONDS="$((ASSESSMENT_TIMEOUT_MINUTES * 60))"
          export AI_SDLC_HLD_RESUME="$RESUME"
          chmod +x ai-sdlc/tooling/providers/github-copilot.sh
          chmod +x ai-sdlc/tooling/providers/github-copilot-review.sh
          ./ai-sdlc/tooling/hld_loop.sh \
            "${{ needs.resolve.outputs.initiative_id }}" \
            github-copilot "$GENERATOR_MODEL" \
            github-copilot "$REVIEWER_MODEL" "$HLD_PROFILE"

      - name: Validate generated initiative
        run: |
          bash ai-sdlc/tooling/validate_structure.sh \
            "ai-sdlc/initiatives/${{ needs.resolve.outputs.initiative_id }}"

      - name: Validate HLD contract before publishing
        run: |
          python3 ai-sdlc/tooling/validate_hld_artifacts.py \
            "ai-sdlc/initiatives/${{ needs.resolve.outputs.initiative_id }}"

      - name: Publish HLD branch without force-push
        env:
          GH_TOKEN: ${{ secrets.AI_SDLC_AUTOMATION_TOKEN || github.token }}
          HLD_BRANCH: ${{ steps.prepare.outputs.name }}
          INITIATIVE_ID: ${{ needs.resolve.outputs.initiative_id }}
          GENERATOR_MODEL: ${{ inputs.generator_model || 'gpt-5.6-luna' }}
          REVIEWER_MODEL: ${{ inputs.reviewer_model || 'gemini-3.5-flash' }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "ai-sdlc/initiatives/$INITIATIVE_ID/hld" \
            "ai-sdlc/initiatives/$INITIATIVE_ID/evidence" \
            "ai-sdlc/initiatives/$INITIATIVE_ID/feedback"
          if git diff --cached --quiet; then
            echo "No HLD changes to publish."
            exit 0
          fi
          git commit -m "feat(hld): generate HLD for $INITIATIVE_ID"
          git remote set-url origin "https://x-access-token:$GH_TOKEN@github.com/$GITHUB_REPOSITORY.git"
          git push origin "$HLD_BRANCH"

          if ! gh pr view "$HLD_BRANCH" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh pr create \
              --repo "$GITHUB_REPOSITORY" \
              --base main \
              --head "$HLD_BRANCH" \
              --title "feat(hld): generate HLD for $INITIATIVE_ID" \
              --body "## AI-generated HLD proposal\n\nInitiative: \`$INITIATIVE_ID\`\nGenerator: \`github-copilot / $GENERATOR_MODEL\`\nReviewer: \`github-copilot / $REVIEWER_MODEL\`\n\nThe bounded AI review loop passed. This draft remains pending human Solution Architect / ARB approval. AI has not approved architecture." \
              --draft
          else
            echo "Updated existing HLD PR for $HLD_BRANCH without force-push."
          fi
