name: Revise HLD from Architect Review

on:
  pull_request_review:
    types: [submitted]

permissions:
  contents: write
  pull-requests: write
  copilot-requests: write

concurrency:
  group: hld-review-feedback-${{ github.event.pull_request.number }}-${{ github.event.review.id }}
  cancel-in-progress: false

jobs:
  revise:
    if: >-
      github.event.review.state == 'changes_requested' &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.event.pull_request.head.ref, 'feat/hld-') &&
      contains(fromJSON('["MEMBER","OWNER","COLLABORATOR"]'), github.event.review.author_association) &&
      github.event.review.user.type != 'Bot'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout HLD branch
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Resolve initiative from the reviewed HLD path
        id: scope
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          mapfile -t initiatives < <(
            gh pr view "$PR_NUMBER" --json files --jq '.files[].path' |
              awk -F/ '/^ai-sdlc\/initiatives\/[^/]+\/hld\// {print $3}' | sort -u
          )
          if [ "${#initiatives[@]}" -ne 1 ]; then
            echo "Expected exactly one initiative HLD in the PR; found ${#initiatives[@]}" >&2
            exit 1
          fi
          echo "initiative_id=${initiatives[0]}" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Collect submitted review feedback
        id: feedback
        env:
          GH_TOKEN: ${{ github.token }}
          INITIATIVE_ID: ${{ steps.scope.outputs.initiative_id }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REVIEW_ID: ${{ github.event.review.id }}
          REVIEWER: ${{ github.event.review.user.login }}
          REVIEW_COMMIT: ${{ github.event.review.commit_id }}
          REVIEW_BODY: ${{ github.event.review.body }}
        run: |
          set -euo pipefail
          review_body_file="$RUNNER_TEMP/review-body.md"
          comments_file="$RUNNER_TEMP/review-comments.json"
          printf '%s' "$REVIEW_BODY" > "$review_body_file"
          gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/reviews/$REVIEW_ID/comments?per_page=100" > "$comments_file"
          python3 ai-sdlc/tooling/create_feedback_batch.py \
            "ai-sdlc/initiatives/$INITIATIVE_ID" \
            --review-id "$REVIEW_ID" \
            --reviewer "$REVIEWER" \
            --review-commit "$REVIEW_COMMIT" \
            --review-body-file "$review_body_file" \
            --comments-file "$comments_file" >> "$GITHUB_OUTPUT"

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install GitHub Copilot CLI and Mermaid renderer
        run: |
          npm install -g @github/copilot @mermaid-js/mermaid-cli

      - name: Resolve HLD models
        id: models
        env:
          INITIATIVE_ID: ${{ steps.scope.outputs.initiative_id }}
        run: |
          set -euo pipefail
          evidence="ai-sdlc/initiatives/$INITIATIVE_ID/evidence/hld-loop.yaml"
          generator_model="$(sed -n 's/^  generator_model: *"\{0,1\}\([^" ]*\).*/\1/p' "$evidence" | head -1)"
          reviewer_model="$(sed -n 's/^  reviewer_model: *"\{0,1\}\([^" ]*\).*/\1/p' "$evidence" | head -1)"
          generator_model="${generator_model:-claude-haiku-4.5}"
          reviewer_model="${reviewer_model:-gemini-3.5-flash}"
          test "$generator_model" != "$reviewer_model" || {
            echo "Generator and reviewer models must differ." >&2
            exit 1
          }
          echo "generator_model=$generator_model" >> "$GITHUB_OUTPUT"
          echo "reviewer_model=$reviewer_model" >> "$GITHUB_OUTPUT"

      - name: Revise and review HLD from one feedback batch
        env:
          GITHUB_TOKEN: ${{ github.token }}
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN || github.token }}
          INITIATIVE_ID: ${{ steps.scope.outputs.initiative_id }}
          AI_SDLC_HLD_PROFILE: auto
          AI_SDLC_AGENT_TIMEOUT_SECONDS: 900
          AI_SDLC_HLD_RESUME: 1
          AI_SDLC_HLD_REVISION_FEEDBACK_FILE: ${{ steps.feedback.outputs.feedback_file }}
        run: |
          set -euo pipefail
          ./ai-sdlc/tooling/hld_loop.sh \
            "$INITIATIVE_ID" \
            github-copilot "${{ steps.models.outputs.generator_model }}" \
            github-copilot "${{ steps.models.outputs.reviewer_model }}" auto

      - name: Validate HLD contract before publishing
        env:
          INITIATIVE_ID: ${{ steps.scope.outputs.initiative_id }}
        run: python3 ai-sdlc/tooling/validate_hld_artifacts.py "ai-sdlc/initiatives/$INITIATIVE_ID"

      - name: Commit feedback-driven HLD update
        env:
          INITIATIVE_ID: ${{ steps.scope.outputs.initiative_id }}
          HLD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "ai-sdlc/initiatives/$INITIATIVE_ID/feedback" \
            "ai-sdlc/initiatives/$INITIATIVE_ID/hld" \
            "ai-sdlc/initiatives/$INITIATIVE_ID/evidence"
          if git diff --cached --quiet; then
            echo "No HLD changes were produced."
            exit 0
          fi
          git commit -m "fix(hld): address architect review feedback"
          git push origin "$HLD_BRANCH"

      - name: Report successful feedback batch
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          FEEDBACK_FILE: ${{ steps.feedback.outputs.feedback_file }}
        run: |
          gh pr comment "$PR_NUMBER" --body "Processed one submitted architecture review as feedback batch \`$FEEDBACK_FILE\`. The HLD revision and bounded AI review completed; human Solution Architect approval is still required."
