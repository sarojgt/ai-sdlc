name: Revise HLD from Architect Review

on:
  pull_request_review:
    types: [submitted]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: write
  copilot-requests: write

concurrency:
  group: hld-review-feedback-${{ github.event.pull_request.number || github.event.issue.number }}-${{ github.event.review.id || github.event.comment.id }}
  cancel-in-progress: false

jobs:
  revise:
    if: >-
      (
        github.event_name == 'pull_request_review' &&
        github.event.review.state == 'changes_requested'
      ) || (
        (
          github.event_name == 'issue_comment' ||
          github.event_name == 'pull_request_review_comment'
        ) &&
        contains(github.event.comment.body, '/ai-sdlc revise-hld')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout HLD branch
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Resolve initiative from the reviewed HLD path
        id: scope
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
        run: |
          set -euo pipefail
          pr_json="$(gh pr view "$PR_NUMBER" --json baseRefName,headRefName,headRepository,headRepositoryOwner,headRefOid)"
          base_ref="$(jq -r '.baseRefName' <<< "$pr_json")"
          head_ref="$(jq -r '.headRefName' <<< "$pr_json")"
          head_repo="$(jq -r '.headRepository.name // empty' <<< "$pr_json")"
          head_owner="$(jq -r '.headRepositoryOwner.login // empty' <<< "$pr_json")"
          test "$base_ref" = main || { echo "HLD feedback must target main." >&2; exit 1; }
          test "$head_owner/$head_repo" = "$GITHUB_REPOSITORY" || {
            echo "HLD feedback requires a branch in the current repository." >&2
            exit 1
          }
          case "$head_ref" in
            feat/hld-*) ;;
            *) echo "HLD feedback requires a feat/hld-* branch." >&2; exit 1 ;;
          esac
          git fetch origin "$head_ref" --quiet
          git switch -c "$head_ref" "origin/$head_ref"
          echo "head_ref=$head_ref" >> "$GITHUB_OUTPUT"
          echo "head_commit=$(jq -r '.headRefOid' <<< "$pr_json")" >> "$GITHUB_OUTPUT"
          mapfile -t initiatives < <(
            gh pr view "$PR_NUMBER" --json files --jq '.files[].path' |
              awk -F/ '/^ai-sdlc\/initiatives\/[^/]+\/hld\// {print $3}' | sort -u
          )
          if [ "${#initiatives[@]}" -ne 1 ]; then
            echo "Expected exactly one initiative HLD in the PR; found ${#initiatives[@]}" >&2
            exit 1
          fi
          echo "initiative_id=${initiatives[0]}" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Verify Solution Architect reviewer
        env:
          REVIEWER: ${{ github.event.review.user.login }}
        run: python3 ai-sdlc/tooling/validate_reviewer.py solution_architect "$REVIEWER"

      - name: Collect submitted review feedback
        id: feedback
        env:
          GH_TOKEN: ${{ github.token }}
          INITIATIVE_ID: ${{ steps.scope.outputs.initiative_id }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
          EVENT_NAME: ${{ github.event_name }}
          REVIEW_ID: ${{ github.event.review.id || github.event.comment.id }}
          REVIEWER: ${{ github.event.review.user.login || github.event.comment.user.login }}
          REVIEW_COMMIT: ${{ github.event.review.commit_id || '' }}
          REVIEW_BODY: ${{ github.event.review.body || github.event.comment.body }}
          COMMENT_URL: ${{ github.event.comment.html_url || '' }}
        run: |
          set -euo pipefail
          review_body_file="$RUNNER_TEMP/review-body.md"
          comments_file="$RUNNER_TEMP/review-comments.json"
          printf '%s' "$REVIEW_BODY" > "$review_body_file"
          if [ "$EVENT_NAME" = "pull_request_review" ]; then
            gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/reviews/$REVIEW_ID/comments?per_page=100" > "$comments_file"
          else
            jq -n --arg body "$REVIEW_BODY" --arg url "$COMMENT_URL" \
              '[{body: $body, html_url: $url}]' > "$comments_file"
          fi
          review_commit="$REVIEW_COMMIT"
          review_commit="${review_commit:-${{ steps.scope.outputs.head_commit }}}"
          python3 ai-sdlc/tooling/create_feedback_batch.py \
            "ai-sdlc/initiatives/$INITIATIVE_ID" \
            --review-id "$REVIEW_ID" \
            --reviewer "$REVIEWER" \
            --review-commit "$review_commit" \
            --review-body-file "$review_body_file" \
            --comments-file "$comments_file" >> "$GITHUB_OUTPUT"

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install GitHub Copilot CLI
        run: npm install -g @github/copilot

      - name: Resolve HLD models
        id: models
        env:
          INITIATIVE_ID: ${{ steps.scope.outputs.initiative_id }}
        run: |
          set -euo pipefail
          evidence="ai-sdlc/initiatives/$INITIATIVE_ID/evidence/hld-loop.yaml"
          generator_model="$(sed -n 's/^  generator_model: *"\{0,1\}\([^" ]*\).*/\1/p' "$evidence" | head -1)"
          reviewer_model="$(sed -n 's/^  reviewer_model: *"\{0,1\}\([^" ]*\).*/\1/p' "$evidence" | head -1)"
          generator_model="${generator_model:-gpt-5.6-luna}"
          reviewer_model="${reviewer_model:-gemini-3.5-flash}"
          test "$generator_model" != "$reviewer_model" || {
            echo "Generator and reviewer models must differ." >&2
            exit 1
          }
          echo "generator_model=$generator_model" >> "$GITHUB_OUTPUT"
          echo "reviewer_model=$reviewer_model" >> "$GITHUB_OUTPUT"

      - name: Revise and review HLD from one feedback batch
        env:
          GITHUB_TOKEN: ${{ github.token }}
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN || github.token }}
          INITIATIVE_ID: ${{ steps.scope.outputs.initiative_id }}
          AI_SDLC_HLD_PROFILE: auto
          AI_SDLC_AGENT_TIMEOUT_SECONDS: 900
          AI_SDLC_HLD_RESUME: 1
          AI_SDLC_HLD_REVISION_FEEDBACK_FILE: ${{ steps.feedback.outputs.feedback_file }}
          AI_SDLC_SKIP_MERMAID_RENDER: 1
        run: |
          set -euo pipefail
          ./ai-sdlc/tooling/hld_loop.sh \
            "$INITIATIVE_ID" \
            github-copilot "${{ steps.models.outputs.generator_model }}" \
            github-copilot "${{ steps.models.outputs.reviewer_model }}" auto

      - name: Validate HLD contract before publishing
        env:
          INITIATIVE_ID: ${{ steps.scope.outputs.initiative_id }}
          AI_SDLC_SKIP_MERMAID_RENDER: 1
        run: python3 ai-sdlc/tooling/validate_hld_artifacts.py "ai-sdlc/initiatives/$INITIATIVE_ID"

      - name: Commit feedback-driven HLD update
        id: publish
        env:
          INITIATIVE_ID: ${{ steps.scope.outputs.initiative_id }}
          HLD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "ai-sdlc/initiatives/$INITIATIVE_ID/hld" \
            "ai-sdlc/initiatives/$INITIATIVE_ID/evidence"
          for feedback_dir in \
            "ai-sdlc/initiatives/$INITIATIVE_ID/feedback/reviews" \
            "ai-sdlc/initiatives/$INITIATIVE_ID/feedback/batches"; do
            [ -e "$feedback_dir" ] && git add "$feedback_dir"
          done
          if git diff --cached --quiet; then
            echo "No HLD changes were produced."
            echo "updated=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "fix(hld): address architect review feedback"
          git push origin "$HLD_BRANCH"
          echo "updated=true" >> "$GITHUB_OUTPUT"

      - name: Resolve processed review threads
        if: steps.publish.outputs.updated == 'true' && github.event_name == 'pull_request_review'
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REVIEW_ID: ${{ github.event.review.id }}
        run: |
          set -euo pipefail
          owner="${GITHUB_REPOSITORY%%/*}"
          repo="${GITHUB_REPOSITORY##*/}"
          review_threads="$(gh api graphql \
            -F owner="$owner" \
            -F repo="$repo" \
            -F number="$PR_NUMBER" \
            -f query='query($owner:String!, $repo:String!, $number:Int!) {
              repository(owner:$owner, name:$repo) {
                pullRequest(number:$number) {
                  reviewThreads(first:100) {
                    nodes {
                      id
                      isResolved
                      comments(first:100) {
                        nodes { pullRequestReview { databaseId } }
                      }
                    }
                  }
                }
              }
            }' \
            | jq -r --argjson review_id "$REVIEW_ID" \
              '.data.repository.pullRequest.reviewThreads.nodes[] |
              select(.isResolved == false) |
              select([.comments.nodes[].pullRequestReview.databaseId] | index($review_id)) |
              .id')"

          while IFS= read -r thread_id; do
            test -n "$thread_id" || continue
            gh api graphql \
              -f query='mutation($threadId:ID!) {
                resolveReviewThread(input:{threadId:$threadId}) {
                  thread { isResolved }
                }
              }' \
              -f threadId="$thread_id" >/dev/null
          done <<< "$review_threads"

          remaining="$(gh api graphql \
            -F owner="$owner" \
            -F repo="$repo" \
            -F number="$PR_NUMBER" \
            -f query='query($owner:String!, $repo:String!, $number:Int!) {
              repository(owner:$owner, name:$repo) { pullRequest(number:$number) {
                reviewThreads(first:100) { nodes { isResolved comments(first:100) {
                  nodes { pullRequestReview { databaseId } }
                } } }
              } }
            }' \
            | jq --argjson review_id "$REVIEW_ID" '[.data.repository.pullRequest.reviewThreads.nodes[] |
              select(.isResolved == false) |
              select([.comments.nodes[].pullRequestReview.databaseId] | index($review_id))] | length')"
          test "$remaining" -eq 0 || {
            echo "Review-thread resolution postcondition failed: $remaining thread(s) remain unresolved." >&2
            exit 1
          }

      - name: Report successful feedback batch
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          FEEDBACK_FILE: ${{ steps.feedback.outputs.feedback_file }}
        run: |
          gh pr comment "$PR_NUMBER" --body "Processed one submitted architecture review as feedback batch \`$FEEDBACK_FILE\`. The HLD revision and bounded AI review completed; human Solution Architect approval is still required."

      - name: Publish review workflow summary
        if: always()
        env:
          INITIATIVE_ID: ${{ steps.scope.outputs.initiative_id }}
          FEEDBACK_FILE: ${{ steps.feedback.outputs.feedback_file }}
        run: |
          set -euo pipefail
          evidence="ai-sdlc/initiatives/$INITIATIVE_ID/evidence/hld-loop.yaml"
          status="$(sed -n 's/^  status: *//p' "$evidence" | head -1 | tr -d '"' || true)"
          decision="$(sed -n 's/^  latest_decision: *//p' "$evidence" | head -1 | tr -d '"' || true)"
          {
            echo "## HLD feedback workflow summary"
            echo "- Initiative: \`$INITIATIVE_ID\`"
            echo "- Feedback batch: \`${FEEDBACK_FILE:-not available}\`"
            echo "- HLD loop status: \`$status\`"
            echo "- Latest AI review decision: \`$decision\`"
            echo "- Previous review evidence was preserved; no review file was deleted."
            echo "- Human Solution Architect / ARB approval remains required."
          } >> "$GITHUB_STEP_SUMMARY"
